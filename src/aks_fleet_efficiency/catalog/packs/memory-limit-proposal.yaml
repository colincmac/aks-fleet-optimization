schema_version: '1.0'
id: AKS-MEM-005
version: 2.0.0
family: memory
evaluator: memory-limit-proposal
evidence_kind: metrics
title: Review bounded memory limit
purpose: An explicitly opted-in, configuration-bound memory limit proposal uses complete
  total-memory usage, not working set alone, plus reviewed allocator/cache, startup
  and failover peaks. Requests, CPU and other containers remain unchanged; owner declarations
  are not source attestation or approval.
sources:
- prometheus
- azure-managed-prometheus
parameters: {}
queries:
  baseline: &id001
    container:
    - memory_request
    - memory_limit
    - memory_total_usage
    - oom_events
    - restarts
    workload:
    - desired_replicas
    - available_replicas
    - observed_replicas
    - hpa_present
    - keda_present
    - vpa_present
    - unschedulable_pods
    - evictions
  guarded: *id001
required_evidence:
  baseline: &id002
  - Complete fresh exact-scoped sources and aligned metric quality
  - Exact historical identities and complete required history; missing is not zero
  - Independent owner-reviewed window/SLO/disruption/scenario bounds
  - Existing QoS, admission, controller, full-grid and reliability guards
  guarded: *id002
limitations:
- An explicitly opted-in, configuration-bound memory limit proposal uses complete
  total-memory usage, not working set alone, plus reviewed allocator/cache, startup
  and failover peaks. Requests, CPU and other containers remain unchanged; owner declarations
  are not source attestation or approval.
- References/digests are integrity declarations, not source attestation or approval.
prerequisites:
- Obtain separate approval for the exact container/configuration, limit and evidence
  window.
- Independently verify allocator/cache and full-memory scenario evidence; preserve
  requests and QoS.
risks:
- Lower hard limits can cause OOM despite unchanged requests and Burstable QoS.
- Sampled total-memory peaks are not proof that all future peaks were observed.
validation:
- Canary the memory limit only under startup, peak and failover load; leave all requests
  unchanged.
- Stop promotion on OOM, restarts, evictions or owner SLO regression.
rollback:
- Restore the original __current_limit_mib__ MiB limit through customer delivery tooling
  on regression; the advisor never rolls back.
actions:
  baseline:
  - Review this limit-only proposal with the owner; no change is authorized or applied.
  guarded:
  - Review this limit-only proposal with the owner; no change is authorized or applied.
baseline_summary: An explicitly opted-in, configuration-bound memory limit proposal
  uses complete total-memory usage, not working set alone, plus reviewed allocator/cache,
  startup and failover peaks. Requests, CPU and other containers remain unchanged;
  owner declarations are not source attestation or approval.
guarded_summary: An explicitly opted-in, configuration-bound memory limit proposal
  uses complete total-memory usage, not working set alone, plus reviewed allocator/cache,
  startup and failover peaks. Requests, CPU and other containers remain unchanged;
  owner declarations are not source attestation or approval.
