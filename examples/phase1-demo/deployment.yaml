apiVersion: apps/v1
kind: Deployment
metadata:
  name: advisor-demo-web
  namespace: fleet-advisor-demo
  labels:
    app.kubernetes.io/name: advisor-demo-web
    app.kubernetes.io/managed-by: containerization-assist
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: advisor-demo-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: advisor-demo-web
        app.kubernetes.io/managed-by: containerization-assist
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args:
            - serve-hostname
            - --port=8080
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
