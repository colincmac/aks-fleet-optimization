apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: advisor-demo-reader
  labels:
    app.kubernetes.io/name: advisor-demo-reader
    app.kubernetes.io/managed-by: containerization-assist
rules:
  - apiGroups: ['']
    resources: [namespaces, nodes, pods, resourcequotas, limitranges]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list]
  - apiGroups: [scheduling.k8s.io]
    resources: [priorityclasses]
    verbs: [get, list]
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    verbs: [get, list]
  - apiGroups: [autoscaling.k8s.io]
    resources: [verticalpodautoscalers]
    verbs: [get, list]
  - apiGroups: [keda.sh]
    resources: [scaledobjects, scaledjobs]
    verbs: [get, list]
  - apiGroups: [karpenter.sh]
    resources: [nodepools, nodeclaims]
    verbs: [get, list]
  - apiGroups: [karpenter.azure.com]
    resources: [aksnodeclasses]
    verbs: [get, list]
  - nonResourceURLs: [/api, /api/*, /apis, /apis/*]
    verbs: [get]
