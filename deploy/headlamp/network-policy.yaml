# Opt-in only: label a dedicated Headlamp pod after approving exact egress rules.
# This starting policy denies all egress. Add scoped API/DNS/identity/backend permits.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fleet-review-egress-boundary
  namespace: headlamp-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: headlamp
      fleet-efficiency/network-isolation: enforced
  policyTypes: [Egress]
  egress: []