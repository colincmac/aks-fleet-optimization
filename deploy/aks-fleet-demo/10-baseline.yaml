---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: startup-profile
  namespace: aks-fleet-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: startup-profile}
  template:
    metadata:
      labels: {app.kubernetes.io/name: startup-profile, app.kubernetes.io/part-of: aks-fleet-demo}
    spec:
      nodeSelector: {kubernetes.io/os: linux}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: sidecar
          restartPolicy: Always
          image: docker.io/library/python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
          args: ["python", "-c", "import time; time.sleep(10**8)"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {cpu: 25m, memory: 32Mi}
        - name: initializer
          image: docker.io/library/python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
          args: ["python", "-c", "import time; time.sleep(3)"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 80Mi}
            limits: {cpu: 75m, memory: 96Mi}
      containers:
        - name: worker
          image: docker.io/library/python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
          args:
            - python
            - -c
            - |
              import time
              from socketserver import BaseRequestHandler, TCPServer

              time.sleep(75)
              working_set = bytearray(b'x') * (24 * 1024 * 1024)

              class Probe(BaseRequestHandler):
                  def handle(self):
                      return

              class ProbeServer(TCPServer):
                  allow_reuse_address = True

              with ProbeServer(('127.0.0.1', 8080), Probe) as server:
                  server.serve_forever()
          startupProbe:
            exec:
              command: ["python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 1).close()"]
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: ["python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 1).close()"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 1).close()"]
            periodSeconds: 15
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 30m, memory: 48Mi}
            limits: {cpu: 100m, memory: 80Mi}