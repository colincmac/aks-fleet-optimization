apiVersion: apps/v1
kind: Deployment
metadata:
  name: idle-fixed
  namespace: aks-fleet-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: idle-fixed}
  template:
    metadata:
      labels: {app.kubernetes.io/name: idle-fixed, app.kubernetes.io/part-of: aks-fleet-demo}
    spec:
      nodeSelector: {kubernetes.io/os: linux}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: docker.io/library/python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
          args: ["python", "-c", "import time; time.sleep(10**8)"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 200m, memory: 96Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: idle-fixed
  namespace: aks-fleet-demo
spec:
  maxUnavailable: 0
  selector:
    matchLabels: {app.kubernetes.io/name: idle-fixed}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-cpu
  namespace: aks-fleet-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: missing-cpu}
  template:
    metadata:
      labels: {app.kubernetes.io/name: missing-cpu, app.kubernetes.io/part-of: aks-fleet-demo}
    spec:
      nodeSelector: {kubernetes.io/os: linux}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: docker.io/library/python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
          args: ["python", "-c", "import time; time.sleep(10**8)"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 32Mi}
