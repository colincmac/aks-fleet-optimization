apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-demo
  namespace: aks-fleet-demo
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: managed-csi
  resources:
    requests: {storage: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: storage-demo
  namespace: aks-fleet-demo
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: storage-demo}
  ports:
    - {name: demo, port: 8080}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage-demo
  namespace: aks-fleet-demo
spec:
  serviceName: storage-demo
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: storage-demo}
  template:
    metadata:
      labels: {app.kubernetes.io/name: storage-demo, app.kubernetes.io/part-of: aks-fleet-demo}
    spec:
      nodeSelector: {kubernetes.io/os: linux}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: demo-disk
          persistentVolumeClaim: {claimName: storage-demo}
      containers:
        - name: worker
          image: docker.io/library/python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
          args: ["python", "-c", "import time; time.sleep(10**8)"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 50m, memory: 48Mi}
          volumeMounts:
            - {name: demo-disk, mountPath: /demo-disk}