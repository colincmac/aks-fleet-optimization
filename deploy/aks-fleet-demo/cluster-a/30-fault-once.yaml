apiVersion: apps/v1
kind: Deployment
metadata:
  name: fault-once
  namespace: aks-fleet-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: fault-once}
  template:
    metadata:
      labels: {app.kubernetes.io/name: fault-once, app.kubernetes.io/part-of: aks-fleet-demo}
    spec:
      nodeSelector: {kubernetes.io/os: linux}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: attempt-markers
          emptyDir: {sizeLimit: 1Mi}
      containers:
        - name: restart-once
          image: docker.io/library/python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
          args:
            - python
            - -c
            - |
              import time
              from pathlib import Path

              marker = Path('/attempts/restart')
              if not marker.exists():
                  marker.touch()
                  time.sleep(120)
                  raise SystemExit(42)
              time.sleep(10**8)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 15m, memory: 24Mi}
            limits: {cpu: 50m, memory: 40Mi}
          volumeMounts:
            - {name: attempt-markers, mountPath: /attempts}
        - name: oom-once
          image: docker.io/library/python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
          args:
            - python
            - -c
            - |
              import time
              from pathlib import Path

              marker = Path('/attempts/oom')
              if not marker.exists():
                  marker.touch()
                  time.sleep(120)
                  blocks = []
                  for _ in range(96):
                      blocks.append(bytearray(b'x') * (1024 * 1024))
                      time.sleep(0.1)
                  raise SystemExit(43)
              time.sleep(10**8)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 15m, memory: 24Mi}
            limits: {cpu: 100m, memory: 48Mi}
          volumeMounts:
            - {name: attempt-markers, mountPath: /attempts}