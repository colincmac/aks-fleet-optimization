apiVersion: batch/v1
kind: Job
metadata:
  name: nap-capacity-demo
  namespace: aks-fleet-demo
  labels: {app.kubernetes.io/name: nap-capacity-demo, app.kubernetes.io/part-of: aks-fleet-demo}
spec:
  suspend: true
  parallelism: 1
  completions: 1
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels: {app.kubernetes.io/name: nap-capacity-demo, app.kubernetes.io/part-of: aks-fleet-demo}
    spec:
      nodeSelector:
        kubernetes.io/os: linux
        karpenter.sh/nodepool: replace-with-approved-nap-pool
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: docker.io/library/python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
          args: ["python", "-c", "import time; time.sleep(180)"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {cpu: 300m, memory: 160Mi}
