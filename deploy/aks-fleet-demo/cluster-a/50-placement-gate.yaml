apiVersion: batch/v1
kind: Job
metadata:
  name: gated-placement
  namespace: aks-fleet-demo
  labels: {app.kubernetes.io/name: gated-placement, app.kubernetes.io/part-of: aks-fleet-demo}
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels: {app.kubernetes.io/name: gated-placement, app.kubernetes.io/part-of: aks-fleet-demo}
    spec:
      nodeSelector: {kubernetes.io/os: linux}
      schedulingGates:
        - name: demo.fleet-advisor.example/hold
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: docker.io/library/python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
          args: ["python", "-c", "import time; time.sleep(120)"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 200m, memory: 96Mi}
