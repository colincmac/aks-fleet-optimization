apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-reserve
  namespace: aks-fleet-demo
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: node-reserve}
  template:
    metadata:
      labels: {app.kubernetes.io/name: node-reserve, app.kubernetes.io/part-of: aks-fleet-demo}
    spec:
      nodeSelector: {kubernetes.io/os: linux, kubernetes.azure.com/mode: user}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: docker.io/library/python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
          args: ["python", "-c", "import time; time.sleep(10**8)"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 15m, memory: 32Mi}
            limits: {cpu: 30m, memory: 48Mi}