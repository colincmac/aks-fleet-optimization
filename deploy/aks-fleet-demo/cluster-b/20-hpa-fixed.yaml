apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: startup-fixed
  namespace: aks-fleet-demo
  labels: {app.kubernetes.io/name: startup-profile, app.kubernetes.io/part-of: aks-fleet-demo}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: startup-profile}
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
