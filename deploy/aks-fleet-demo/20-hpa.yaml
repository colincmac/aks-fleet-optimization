apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-pulse
  namespace: aks-fleet-demo
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: cpu-pulse}
  template:
    metadata:
      labels: {app.kubernetes.io/name: cpu-pulse, app.kubernetes.io/part-of: aks-fleet-demo}
    spec:
      nodeSelector: {kubernetes.io/os: linux}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: cpu-pulse}
      containers:
        - name: worker
          image: docker.io/library/python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
          args:
            - python
            - -c
            - |
              import time

              while True:
                  deadline = time.monotonic() + 90
                  while time.monotonic() < deadline:
                      pass
                  time.sleep(30)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 100m, memory: 48Mi}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cpu-pulse
  namespace: aks-fleet-demo
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: cpu-pulse}
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}