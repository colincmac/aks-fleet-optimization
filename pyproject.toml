[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aks-fleet-efficiency-advisor"
version = "0.1.0"
description = "Evidence-first AKS fleet efficiency assessment scaffold"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AKS Fleet Efficiency Advisor contributors" }]
dependencies = [
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
azure = [
  "azure-identity>=1.19,<2",
  "azure-mgmt-resourcegraph>=8.0,<9",
  "azure-monitor-query>=1.4,<2",
]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1"]
kubernetes = ["kubernetes>=37.0.1,<38"]
metrics = ["httpx>=0.28.1,<0.29"]
dev = [
  "build>=1.2,<2",
  "packaging>=24,<27",
  "setuptools>=68",
  "wheel>=0.45,<1",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
aks-fleet-advisor = "aks_fleet_efficiency.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aks_fleet_efficiency.catalog" = ["*.yaml", "packs/*.yaml", "queries/*.promql", "sources/*.yaml", "recordings/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aks_fleet_efficiency"]
