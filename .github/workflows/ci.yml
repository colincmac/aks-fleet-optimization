name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  headlamp-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/headlamp-fleet-efficiency
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/headlamp-fleet-efficiency/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[dev,kubernetes]'
      - name: Install checksum-pinned PromQL verifier
        run: python scripts/setup_promtool.py --download
      - name: Verify source and installed wheel
        run: >-
          python scripts/verify.py
          --output-dir "${{ runner.temp }}/aks-advisor-verification"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: synthetic-verification-${{ matrix.os }}
          path: ${{ runner.temp }}/aks-advisor-verification/
          if-no-files-found: ignore
          retention-days: 7
