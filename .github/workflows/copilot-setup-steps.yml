name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - pyproject.toml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - pyproject.toml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and development tools
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Generate schemas
        run: python scripts/generate_schemas.py
      - name: Verify fixture path
        run: >-
          aks-fleet-advisor analyze
          --snapshot examples/fixtures/fleet-snapshot.json
          --config examples/advisor-config.yaml
          --format json
          --output /tmp/report.json
